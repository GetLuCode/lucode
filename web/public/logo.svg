<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 44" width="210" height="44" fill="none">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="box-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00b89a"/>
    </linearGradient>
  </defs>

  <!-- Icon mark: terminal box -->
  <rect x="2" y="2" width="40" height="40" rx="8" fill="#00d4aa" opacity="0.07" filter="url(#box-glow)"/>
  <rect x="2" y="2" width="40" height="40" rx="8" fill="#0f0f12"/>
  <rect x="2" y="2" width="40" height="40" rx="8" stroke="#00d4aa" stroke-width="1.4" stroke-opacity="0.6"/>
  <rect x="3.5" y="3.5" width="37" height="37" rx="7" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>

  <!-- Top bar: 3 dots -->
  <circle cx="11" cy="11" r="2" fill="#2e2e35"/>
  <circle cx="17.5" cy="11" r="2" fill="#2e2e35"/>
  <circle cx="24" cy="11" r="2" fill="#2e2e35"/>
  <line x1="2" y1="17" x2="42" y2="17" stroke="#1e1e24" stroke-width="1"/>

  <!-- Prompt > -->
  <path d="M12 24 L20 30 L12 36"
        stroke="url(#teal-grad)" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Cursor _ -->
  <rect x="22" y="34" width="10" height="2" rx="1" fill="#00d4aa" filter="url(#glow)"/>

  <!-- Wordmark (tspan handles x automatically, no x math needed) -->
  <text
    x="54" y="31"
    font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace"
    font-size="23"
    font-weight="600"
    letter-spacing="-0.5">
    <tspan fill="#00d4aa">Lu</tspan><tspan fill="#e8e4dd">Code</tspan>
  </text>
</svg>
