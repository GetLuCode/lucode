<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" fill="none">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="box-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="text-glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00a8cc"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0e"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <linearGradient id="line-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00d4aa" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#00d4aa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="url(#bg-grad)"/>
  <!-- Subtle border -->
  <rect x="0.75" y="0.75" width="798.5" height="198.5" rx="15.5" stroke="#222226" stroke-width="1.5"/>
  <!-- Teal accent edge glow -->
  <rect x="0.75" y="0.75" width="798.5" height="198.5" rx="15.5" stroke="url(#line-grad-h)" stroke-width="1.5"/>

  <!-- Background grid lines (subtle) -->
  <g stroke="#1a1a20" stroke-width="1" opacity="0.6">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
  </g>

  <!-- Decorative code lines (left atmosphere) -->
  <text x="32" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2e2e35">$ lucode start</text>
  <text x="32" y="70" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1e3a32">▶ Session started · 3 agents</text>
  <text x="32" y="148" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2e2e35">✓ hook approved</text>
  <text x="32" y="166" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1e3a32">● running · 142 msgs</text>

  <!-- Decorative code lines (right atmosphere) -->
  <text x="768" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2e2e35" text-anchor="end">multi-session</text>
  <text x="768" y="148" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2e2e35" text-anchor="end">hook · approval</text>
  <text x="768" y="166" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1e3a32" text-anchor="end">real-time · search</text>

  <!-- ─── Icon mark ─── -->
  <rect x="246" y="54" width="92" height="92" rx="18" fill="#00d4aa" opacity="0.06" filter="url(#box-glow)"/>
  <rect x="246" y="54" width="92" height="92" rx="18" fill="#0f0f12"/>
  <rect x="246" y="54" width="92" height="92" rx="18" stroke="#00d4aa" stroke-width="1.8" stroke-opacity="0.55"/>
  <rect x="248" y="56" width="88" height="88" rx="17" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>

  <!-- Top bar dots -->
  <circle cx="262" cy="70" r="4" fill="#2e2e35"/>
  <circle cx="275" cy="70" r="4" fill="#2e2e35"/>
  <circle cx="288" cy="70" r="4" fill="#2e2e35"/>
  <line x1="246" y1="82" x2="338" y2="82" stroke="#1e1e24" stroke-width="1.5"/>

  <!-- Prompt > -->
  <path d="M265 97 L284 110 L265 123"
        stroke="url(#teal-grad)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Cursor _ -->
  <rect x="288" y="120" width="24" height="5" rx="2.5" fill="#00d4aa" filter="url(#glow)"/>

  <!-- ─── Wordmark ─── -->
  <text x="352" y="122"
        font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace"
        font-size="58" font-weight="700" letter-spacing="-2"
        fill="#00d4aa" opacity="0.35" filter="url(#text-glow)">Lu</text>
  <text x="352" y="122"
        font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace"
        font-size="58" font-weight="700" letter-spacing="-2">
    <tspan fill="#00d4aa">Lu</tspan><tspan fill="#e8e4dd">Code</tspan>
  </text>

  <!-- Tagline -->
  <text x="352" y="148"
        font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace"
        font-size="13" font-weight="400" letter-spacing="0.5"
        fill="#6b6771">Multi-agent Orchestrator</text>
</svg>
