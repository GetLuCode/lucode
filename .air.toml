root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/lucode.exe ./cmd/lucode"
  entrypoint = "./tmp/lucode.exe"
  args_bin = ["--port=8090", "--nats-url=nats://127.0.0.1:4222", "--nats-creds=C:\\path\\to\\platform.creds", "--working-dir=C:\\projects", "--aiapi-url=http://localhost:8091", "--role=hub"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_dir = ["cmd", "internal", "web/dist"]
  exclude_dir = ["node_modules", "web/node_modules"]
  delay = 1000
  stop_on_error = false
  log = "build-errors.log"
  poll = false
  poll_interval = 0

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  main_failed = "red"

[misc]
  clean_on_exit = false

[log]
  main_only = false
  time = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true